name: Deploy

on:
 push:
  branches: [main]
 pull_request:
  types: [opened, synchronize]

concurrency:
 group: deploy-${{ github.ref }}
 cancel-in-progress: true

jobs:
 deploy-shell:
  runs-on: ubuntu-latest
  permissions:
   pull-requests: write
  steps:
   - uses: actions/checkout@v4
   - uses: pnpm/action-setup@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: pnpm
   - run: pnpm install
   - run: pnpm add -wD wrangler
   - name: Build demo
     run: pnpm --filter @design-editor/demo build
   - name: Deploy shell
     id: deploy-shell
     uses: cloudflare/wrangler-action@v3
     with:
      apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      command: pages deploy packages/demo/dist --project-name=${{ vars.CF_SHELL_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
   - name: Comment preview URL on PR
     if: github.event_name == 'pull_request'
     uses: actions/github-script@v7
     with:
      script: |
       const body = `🚀 **Preview deployed**\n\n${{ steps.deploy-shell.outputs.deployment-url }}`;
       const { data: comments } = await github.rest.issues.listComments({
         owner: context.repo.owner,
         repo: context.repo.repo,
         issue_number: context.issue.number,
       });
       const existing = comments.find(c => c.body.includes('🚀 **Preview deployed**'));
       if (existing) {
         await github.rest.issues.updateComment({
           owner: context.repo.owner,
           repo: context.repo.repo,
           comment_id: existing.id,
           body,
         });
       } else {
         await github.rest.issues.createComment({
           owner: context.repo.owner,
           repo: context.repo.repo,
           issue_number: context.issue.number,
           body,
         });
       }
