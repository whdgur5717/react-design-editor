name: tmp-agent-system-action-e2e

on:
 workflow_dispatch:
  inputs:
   prompt:
    description: "Prompt for Codex behavioral test"
    required: false
    default: "먼저 네가 사용 가능한 Skill/능력을 설명하고, 그 다음 이 저장소 변경사항을 코드리뷰해줘. 리뷰는 문제점/개선점/우선순위로 정리해줘."

jobs:
 codex_subscription_e2e:
  runs-on: ubuntu-latest
  permissions:
   contents: read
  steps:
   - name: Checkout
     uses: actions/checkout@v5

   - name: Run local action (Codex subscription)
     id: agent
     uses: ./agent-system-action
     with:
      mode: prompt
      provider: codex
      prompt: ${{ inputs.prompt }}
      skill-directories: .agents/skills
      codex-auth-json-b64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
      github-comment-mode: off
      display-report: true
      track-progress: false

   - name: Assert final output
     shell: bash
     env:
      FINAL_MESSAGE: ${{ steps.agent.outputs.final_message }}
      EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
     run: |
      python3 - <<'PY'
      import os

      final = os.environ.get("FINAL_MESSAGE", "")
      execution_file = os.environ.get("EXECUTION_FILE", "")

      print("execution_file=", execution_file)
      print("final_preview=", final[:300].replace("\n", "\\n"))

      if not final.strip():
          raise SystemExit("final_message is empty")

      if not execution_file.strip():
          raise SystemExit("execution_file output is empty")
      PY
