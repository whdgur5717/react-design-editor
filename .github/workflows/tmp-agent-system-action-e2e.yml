name: tmp-agent-system-action-e2e

on:
 workflow_dispatch:

jobs:
 codex_subscription_e2e:
  runs-on: ubuntu-latest
  permissions:
   contents: read
  steps:
   - name: Checkout
     uses: actions/checkout@v5

   - name: Run local action (Codex subscription)
     id: agent
     uses: ./agent-system-action
     with:
      mode: prompt
      provider: codex
      prompt: "Reply with exactly: E2E_OK"
      codex-auth-json-b64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
      github-comment-mode: off
      display-report: true
      track-progress: false

   - name: Assert final output
     shell: bash
     run: |
      final="${{ steps.agent.outputs.final_message }}"
      exec_file="${{ steps.agent.outputs.execution_file }}"
      echo "final_message=$final"
      echo "execution_file=$exec_file"
      if [[ -z "$final" ]]; then
        echo "final_message is empty"
        exit 1
      fi
      if [[ "$final" != *"E2E_OK"* ]]; then
        echo "Expected output to contain E2E_OK"
        exit 1
      fi
      if [[ -z "$exec_file" ]]; then
        echo "execution_file output is empty"
        exit 1
      fi
