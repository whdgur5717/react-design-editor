name: tmp-agent-system-action-e2e

on:
 workflow_dispatch:
  inputs:
   prompt:
    description: "Prompt for Codex behavioral test"
    required: false
    default: "수정이 필요한 경우 agent-system-action/tmp-e2e-change.txt 파일을 만들고 한 줄 텍스트를 작성한 뒤 저장해. 마지막 줄에는 hello를 출력해."

jobs:
 codex_subscription_e2e:
  runs-on: ubuntu-latest
  permissions:
   contents: write
  steps:
   - name: Checkout
     uses: actions/checkout@v5

   - name: Run local action (Codex subscription)
     id: agent
     uses: ./agent-system-action
     with:
      mode: prompt
      provider: codex
      behavior: branch-commit-push
      prompt: ${{ inputs.prompt }}
      skill-directories: .agents/skills
      codex-auth-json-b64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
      github-token: ${{ github.token }}
      github-comment-mode: off
      display-report: true
      track-progress: false

   - name: Assert outputs
     shell: bash
     env:
      FINAL_MESSAGE: ${{ steps.agent.outputs.final_message }}
      EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
      BRANCH_NAME: ${{ steps.agent.outputs.branch_name }}
      COMPARE_URL: ${{ steps.agent.outputs.compare_url }}
     run: |
      python3 - <<'PY'
      import os

      final = os.environ.get("FINAL_MESSAGE", "")
      execution_file = os.environ.get("EXECUTION_FILE", "")
      branch_name = os.environ.get("BRANCH_NAME", "")
      compare_url = os.environ.get("COMPARE_URL", "")

      print("execution_file=", execution_file)
      print("branch_name=", branch_name)
      print("compare_url=", compare_url)
      print("final_preview=", final[:300].replace("\n", "\\n"))

      if not final.strip():
          raise SystemExit("final_message is empty")
      if not execution_file.strip():
          raise SystemExit("execution_file output is empty")
      if not branch_name.strip():
          raise SystemExit("branch_name output is empty")
      if not compare_url.strip():
          raise SystemExit("compare_url output is empty")
      PY
