name: E2E Tests

on:
 pull_request:
  types: [opened, synchronize]

jobs:
 e2e:
  runs-on: ubuntu-latest
  permissions:
   contents: read
   pull-requests: write
   issues: write
   id-token: write
  steps:
   - uses: actions/checkout@v4

   - uses: pnpm/action-setup@v4

   - uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: "pnpm"

   - run: pnpm install

   - name: Setup Playwright
     uses: ./.github/actions/setup-playwright

   - name: Run E2E tests
     id: e2e
     shell: bash
     run: set -o pipefail; pnpm test:e2e 2>&1 | tee e2e-output.log
     continue-on-error: true

   - name: Analyze E2E failure with Claude
     if: steps.e2e.outcome == 'failure'
     uses: anthropics/claude-code-action@v1
     with:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      prompt: |
       REPO: ${{ github.repository }}
       PR NUMBER: ${{ github.event.pull_request.number }}

       ## 역할
       당신은 E2E 테스트 실패의 원인을 추적하는 조사관입니다.
       "무엇이 실패했고, 왜 실패했는지"까지만 보고하세요.

       ## 분석 절차
       1. `e2e-output.log`에서 테스트 실패 로그를 읽으세요
       2. `test-results/` 폴더에서 `error-context.md` 파일들을 모두 찾아 읽으세요
       3. 실패한 테스트의 소스코드(`e2e/tests/*.spec.ts`)와 POM(`e2e/pom/`)을 확인하세요
       4. 관련 애플리케이션 코드 영역을 탐색하세요

       ## 원칙
       - 수정 방향, 설계 제안, 코드 픽스를 절대 포함하지 마세요. "~하면 된다", "~를 추가하는 방향", "~중 선택" 같은 표현은 금지입니다.
       - 사실(fact)만 서술하세요. 코드가 어떤 상태인지, 어떤 값이 기대되었고 실제로는 어땠는지를 보고하세요.
       - 파일 경로는 GitHub 링크 형태로 제공하세요.

       분석 결과를 `gh pr comment`로 PR에 코멘트로 남겨주세요.

       ## 응답 형식
       ### 🔴 E2E 테스트 실패 분석

       **실패한 테스트**:
       - `파일경로:라인` — 테스트 설명

       **에러 요약**:
       에러 메시지를 코드블록으로 인용하고, 기대값과 실제값의 차이를 한 줄로 요약

       **원인 추적**:
       | 파일 | 현재 상태 |
       |------|----------|
       | [파일명](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/파일경로#L라인번호) | 이 코드가 현재 어떤 상태인지 사실만 기술 |

       ---
       *🤖 이 분석은 AI가 자동 생성한 초기 조사 결과입니다.*
      show_full_output: true
      claude_args: |
       --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*)"

   - name: Fail if E2E tests failed
     if: steps.e2e.outcome == 'failure'
     run: exit 1
