name: E2E Tests

on:
 pull_request:
  types: [opened, synchronize]

jobs:
 e2e:
  runs-on: ubuntu-latest
  permissions:
   contents: read
  steps:
   - uses: actions/checkout@v4

   - uses: pnpm/action-setup@v4

   - uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: "pnpm"

   - run: pnpm install

   - name: Setup Playwright
     uses: ./.github/actions/setup-playwright

   - name: Run E2E tests
     run: pnpm test:e2e
