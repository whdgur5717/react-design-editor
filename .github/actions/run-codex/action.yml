name: Run Codex
description: Run Codex with ChatGPT subscription authentication

inputs:
 auth-json-b64:
  description: Base64-encoded Codex auth.json
  required: true
 secret-update-token:
  description: GitHub token with repository Secrets write permission
  required: true
 prompt:
  description: Instructions passed to Codex
  required: true
 model:
  description: Codex model
  default: gpt-5.6-luna
 effort:
  description: Model reasoning effort
  default: medium
 codex-version:
  description: Pinned @openai/codex version
  default: 0.153.4

outputs:
 final-message:
  description: Final response emitted by Codex
  value: ${{ steps.codex.outputs.final-message }}

runs:
 using: composite
 steps:
  - name: Set up Node.js
    uses: actions/setup-node@v7
    with:
     node-version: 24

  - name: Restore auth.json
    id: auth
    shell: bash
    env:
     CODEX_AUTH_JSON_B64: ${{ inputs.auth-json-b64 }}
     SECRET_UPDATE_TOKEN: ${{ inputs.secret-update-token }}
    run: |
     set -euo pipefail

     test -n "$CODEX_AUTH_JSON_B64"
     test -n "$SECRET_UPDATE_TOKEN"

     codex_home="$(mktemp -d "$RUNNER_TEMP/codex-home.XXXXXX")"
     chmod 700 "$codex_home"
     printf '%s' "$CODEX_AUTH_JSON_B64" | base64 --decode > "$codex_home/auth.json"
     chmod 600 "$codex_home/auth.json"
     jq -e '.auth_mode == "chatgpt" and ((.tokens.refresh_token // "") | length > 0)' \
       "$codex_home/auth.json" >/dev/null

     cat > "$codex_home/config.toml" <<EOF
     default_permissions = "analysis"

     [permissions.analysis]
     extends = ":read-only"

     [permissions.analysis.filesystem]
     "$codex_home" = "deny"
     EOF
     chmod 600 "$codex_home/config.toml"

     echo "codex-home=$codex_home" >> "$GITHUB_OUTPUT"
     echo "auth-sha=$(sha256sum "$codex_home/auth.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  - name: Enable Codex sandbox
    if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
    shell: bash
    run: |
     set -euo pipefail

     if [[ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)" == "0" ]]; then
       sudo sysctl -w kernel.unprivileged_userns_clone=1
     fi
     if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == "1" ]]; then
       sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
     fi

  - name: Run Codex
    id: codex
    shell: bash
    env:
     CODEX_HOME: ${{ steps.auth.outputs.codex-home }}
     CODEX_PROMPT: ${{ inputs.prompt }}
     CODEX_MODEL: ${{ inputs.model }}
     CODEX_EFFORT: ${{ inputs.effort }}
     CODEX_VERSION: ${{ inputs.codex-version }}
    run: |
     set -euo pipefail

     output_file="$RUNNER_TEMP/codex-last-message.md"
     printf '%s' "$CODEX_PROMPT" |
       npm exec --yes --package="@openai/codex@$CODEX_VERSION" -- \
         codex --ask-for-approval never exec \
           --cd "$GITHUB_WORKSPACE" \
           --ephemeral \
           --strict-config \
           --color never \
           --model "$CODEX_MODEL" \
           --config "model_reasoning_effort=\"$CODEX_EFFORT\"" \
           --output-last-message "$output_file" \
           -

     delimiter="CODEX_$(openssl rand -hex 16)"
     {
       echo "final-message<<$delimiter"
       cat "$output_file"
       echo
       echo "$delimiter"
     } >> "$GITHUB_OUTPUT"

  - name: Persist refreshed auth.json
    if: ${{ always() && steps.auth.outcome == 'success' }}
    shell: bash
    env:
     CODEX_HOME: ${{ steps.auth.outputs.codex-home }}
     ORIGINAL_AUTH_SHA: ${{ steps.auth.outputs.auth-sha }}
     GH_TOKEN: ${{ inputs.secret-update-token }}
    run: |
     set -euo pipefail

     auth_file="$CODEX_HOME/auth.json"
     jq -e '.auth_mode == "chatgpt" and ((.tokens.refresh_token // "") | length > 0)' \
       "$auth_file" >/dev/null
     if [[ "$(sha256sum "$auth_file" | cut -d ' ' -f 1)" != "$ORIGINAL_AUTH_SHA" ]]; then
       base64 -w 0 "$auth_file" | gh secret set CODEX_AUTH_JSON_B64 --repo "$GITHUB_REPOSITORY"
     fi

  - name: Remove auth.json
    if: ${{ always() && steps.auth.outcome == 'success' }}
    shell: bash
    env:
     CODEX_HOME: ${{ steps.auth.outputs.codex-home }}
    run: |
     if [[ "$CODEX_HOME" == "$RUNNER_TEMP"/codex-home.* ]]; then
       rm -rf -- "$CODEX_HOME"
     fi
